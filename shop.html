
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All | VELORA</title>
    <link rel="stylesheet" href="shop.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">VELORA</a>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop All</a>
            <a href="wishlist.html">Wishlist ♡</a>
            <a href="cart.html">Bag 🛍</a>
        </nav>
    </header>

    <main>
        <section class="shop-heading">
            <p class="eyebrow">FIND YOUR STYLE</p>
            <h1>Shop All</h1>
            <p>Discover your next favourite look.</p>
        </section>

        <section class="shop-controls">
            <input
                type="text"
                id="shopSearch"
                placeholder="Search products or categories..."
                aria-label="Search products"
            >

            <p id="resultCount"></p>
        </section>

        <section id="categorySections"></section>

        <p id="noResults" class="no-results" hidden>
            No products found. Try another search.
        </p>
    </main>

    <footer class="footer">
        <p>© 2026 VELORA. Find your style.</p>
    </footer>

    <script>
        const categories = [
            {
                id: "soft-girl",
                name: "Soft Girl",
                images: [
                    "img4.jpg",
                    "img15.jpg",
                    "img18.jpg",
                    "img21.jpg",
                    "img24.jpg",
                    "img27.jpg",
                    "img30.jpg"
                ]
            },
            {
                id: "old-fashion",
                name: "Old Fashion",
                images: [
                    "img33.jpg",
                    "img38.jpg",
                    "img41.jpg",
                    "img44.jpg",
                    "img47.jpg",
                    "img50.jpg",
                    "img53.jpg"
                ]
            },
            {
                id: "minimal-chic",
                name: "Minimal Chic",
                images: [
                    "img56.jpg",
                    "img59.jpg",
                    "img64.jpg",
                    "img67.jpg",
                    "img70.jpg",
                    "img73.jpg"
                ]
            },
            {
                id: "street-style",
                name: "Street Style",
                images: [
                    "img76.jpg",
                    "img84.jpg",
                    "img89.jpg",
                    "img92.jpg",
                    "img95.jpg",
                    "img98.jpg"
                ]
            },
            {
                id: "romantic",
                name: "Romantic",
                images: [
                    "img107.jpg",
                    "img112.jpg",
                    "img115.jpg",
                    "img118.jpg",
                    "img121.jpg",
                    "img124.jpg"
                ]
            },
            {
                id: "coquette",
                name: "Coquette",
                images: [
                    "img127.jpg",
                    "img130.jpg",
                    "img133.jpg",
                    "img138.jpg",
                    "img141.jpg",
                    "img144.jpg",
                    "img148.jpg",
                    "img151.jpg"
                ]
            },
            {
                id: "edgy",
                name: "Edgy",
                images: [
                    "img160.jpg",
                    "img165.jpg",
                    "img168.jpg",
                    "img171.jpg",
                    "img174.jpg",
                    "img177.jpg",
                    "img180.jpg"
                ]
            }
        ];

        const categorySections = document.getElementById("categorySections");
        const shopSearch = document.getElementById("shopSearch");
        const resultCount = document.getElementById("resultCount");
        const noResults = document.getElementById("noResults");

        let productNumber = 0;
        const allProducts = [];

        categories.forEach(category => {
            const section = document.createElement("section");
            section.className = "category-section";
            section.id = category.id;

            section.innerHTML = `
                <div class="category-heading">
                    <div>
                        <p class="category-label">EXPLORE THE COLLECTION</p>
                        <h2>${category.name}</h2>
                    </div>
                    <span class="category-count">${category.images.length} styles</span>
                </div>
                <div class="products-grid"></div>
            `;

            const grid = section.querySelector(".products-grid");

            category.images.forEach(imageName => {
                productNumber++;

                const product = {
                    id: "velora-" + productNumber,
                    name: category.name + " Look " +
                        String(productNumber).padStart(2, "0"),
                    price: 799 + ((productNumber * 137) % 1200),
                    image: imageName,
                    category: category.name,
                    categoryId: category.id
                };

                allProducts.push(product);

                const card = document.createElement("article");
                card.className = "product-card";

                card.dataset.name = product.name.toLowerCase();
                card.dataset.category = category.name.toLowerCase();
                card.dataset.categoryId = category.id;

                card.innerHTML = `
                    <div class="product-image">
                        <img
                            src="images/${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                        <button
                            type="button"
                            class="heart"
                            data-wishlist-button
                            data-id="${product.id}"
                            data-name="${product.name}"
                            data-price="${product.price}"
                            data-image="images/${product.image}"
                            aria-label="Add ${product.name} to wishlist"
                            title="Add to wishlist"
                        >♡</button>
                    </div>

                    <div class="product-info">
                        <p class="product-category">${product.category}</p>
                        <h3>${product.name}</h3>

                        <div class="product-bottom">
                            <span class="product-price">₹${product.price}</span>

                            <button
                                type="button"
                                class="add"
                                data-product="${product.name}"
                                data-price="${product.price}"
                                data-category="${product.category}"
                                data-image="images/${product.image}"
                            >Add to Bag +</button>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            categorySections.appendChild(section);
        });

        function filterProducts() {
            const searchText = shopSearch.value.trim().toLowerCase();
            let visibleCount = 0;

            document.querySelectorAll(".category-section").forEach(section => {
                const cards = section.querySelectorAll(".product-card");
                let categoryVisible = 0;

                cards.forEach(card => {
                    const matches =
                        card.dataset.name.includes(searchText) ||
                        card.dataset.category.includes(searchText);

                    card.style.display = matches ? "" : "none";

                    if (matches) {
                        visibleCount++;
                        categoryVisible++;
                    }
                });

                section.style.display = categoryVisible > 0 ? "" : "none";
            });

            resultCount.textContent =
                visibleCount + (visibleCount === 1 ? " product" : " products");

            noResults.hidden = visibleCount !== 0;
        }

        shopSearch.addEventListener("input", filterProducts);

        filterProducts();
    </script>

    <script src="script.js"></script>
    <script src="wishlist.js"></script>

</body>
</html>
